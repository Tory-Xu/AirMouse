<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>AirMouse | 文字与键盘</title>
    <link rel="icon" type="image/png" href="/static/keys.png">
    <style>
        body.full-mode {
            overflow: hidden;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            min-height: 0;
        }

        /* 全屏按钮的基础样式 */
        .fs-btn-kb {
            flex: 0 0 40px;
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fs-btn-kb svg {
            fill: #444;
            width: 22px;
            height: 22px;
        }

        .fs-btn-kb:active {
            background: #222;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        [hidden] { display: none !important; }

        :focus-visible { outline: 2px solid #69adff; outline-offset: 3px; }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 5px;
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-height: 0;
            padding: 2px;
        }

        /* 输入区 */
        .input-section {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #111;
            gap: 8px;
            flex: 0 0 auto;
            flex-wrap: wrap;
            width: 100%;
            border-radius: 10px;
        }

        #text-input {
            width: 100%;
            min-width: 0;
            min-height: 120px;
            height: clamp(120px, calc(var(--viewport-height, 100dvh) * 0.35), 280px);
            resize: vertical;
            background: #1c1c24;
            border: 1px solid #484858;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font: inherit;
            font-size: 16px;
            line-height: 1.6;
            touch-action: auto;
            user-select: text;
            -webkit-user-select: text;
            -webkit-touch-callout: default;
        }

        .send-btn {
            flex: 0 0 auto;
            padding: 10px 20px;
            min-height: 44px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        body.text-mode {
            overflow-y: auto;
            padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
        }

        .text-mode .container {
            max-width: 720px;
            flex: 0 0 auto;
            gap: 12px;
        }

        .mode-switch {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }

        .mode-switch button {
            padding: 8px 12px;
            min-height: 40px;
            white-space: nowrap;
        }

        .mode-switch button[aria-pressed="true"] {
            background: #007aff;
            border-color: #007aff;
        }

        .text-panel {
            background: #111;
            border-radius: 12px;
            padding: 18px;
        }

        .text-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .text-heading h1 { margin: 0; font-size: 22px; }
        #text-connection { color: #a7a7b8; font-size: 13px; white-space: nowrap; }
        #text-connection[data-connected="true"] { color: #6edc91; }
        .text-hint, #send-status { color: #aaaabb; font-size: 14px; line-height: 1.6; }
        #text-form { display: flex; flex-direction: column; gap: 10px; }
        #text-form label { font-size: 14px; color: #ddd; }
        .send-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            bottom: 0;
            padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            background: #111;
        }
        #composition-hint { font-size: 13px; color: #aaaabb; }
        #send-status { margin: 10px 0 0; min-height: 23px; }
        #send-status[data-kind="error"], #send-status[data-kind="unconfirmed"] { color: #ffbd78; }
        #send-status[data-kind="success"] { color: #6edc91; }
        .recent-text { border-top: 1px solid #333; margin-top: 18px; padding-top: 14px; }
        .recent-text h2 { margin: 0; font-size: 14px; color: #bbb; }
        #last-sent-text {
            margin-bottom: 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            overflow-y: auto;
            max-height: 180px;
            font: inherit;
            font-size: 16px;
            line-height: 1.6;
            user-select: text;
            -webkit-user-select: text;
        }

        .keyboard-grid, .keyboard-grid * {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* 基础按钮 */
        button {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #eee;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            height: 100%;
            /* 让按钮随行高自适应 */
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            transition: all 0.1s;
        }

        .keyboard-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            flex: 1;
            /* 占据剩余所有垂直空间 */
        }

        .row {
            display: flex;
            gap: 4px;
            width: 100%;
            flex: 1;
            /* 每一行平分垂直空间 */
        }


        /* 交互反馈 */
        button:active {
            background: #007AFF !important;
        }

        button.locked {
            background: #ff9500 !important;
            color: #000;
            border-color: #ff9500;
        }

        /* 键宽比例 */
        .k-f {
            color: #888;
            background: #0d0d0d;
        }


        .esc {
            flex: 0.8;
            color: #ff3b30;
        }

        .k-wide {
            flex: 1.5;
            background: #222;
        }

        .k-arrow {
            flex: 0.8;
            background: #4f4f4f;
        }

        .k-caps {
            flex: 1.6;
            background: #222;
            font-size: 9px;
        }

        .k-enter {
            flex: 2;
            background: #005bb5;
        }

        .k-shift {
            flex: 2;
        }

        .k-shift-r {
            flex: 0.85;
        }

        .k-space {
            flex: 7;
            background: #222;
        }



        /* 底部导航按钮 */
        .footer-nav {
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 5px 0;
            background: #000;
        }

        .nav-btn {
            background: #333;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            flex: 0 1 auto;
            min-height: 36px;
        }

        .full-mode.tablet-mode .keyboard-grid button {
            border-radius: 8px;
            font-size: 16px;
        }


        /* 强制横屏逻辑 (针对手机) */
        @media screen and (orientation: portrait) and (max-width: 1000px) {
            body.full-mode {
                transform-origin: center center;
                width: 100vh !important;
                height: 100vw !important;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                padding: 10px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            body.full-mode.not-fs {
                transform: translate(-50%, -50%) rotate(90deg);
            }

            .full-mode .container {
                max-width: none;
            }
        }

        /* 非全屏下的缩放 */
        body.full-mode.not-fs .container {
            transform: scale(0.9);
            transform-origin: top center;
        }
    </style>
</head>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/text-input.js"></script>
    <script>
        const socket = io();
        setupTextInput(socket);
        let keyboardMode = 'text';
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const feedback = () => {
            if (navigator.vibrate) navigator.vibrate(30);
            if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        };
        const v = feedback;
        let locks = {
            ctrl: false, ctrl_r: false,
            win: false,
            alt: false, alt_r: false,
            shift: false, shift_r: false,
            caps: false
        };
        let rT, rI;
        const pressedKeys = new Set();
        const releaseTimers = new Map();
        const lockTimers = new Map();
        const newlyLockedKeys = new Set();

        function hPS(norm, shft, event) { hP(locks.shift || locks.shift_r ? shft : norm, event); }

        function captureKeyPointer(event) {
            if (event && event.cancelable) event.preventDefault();
            if (event && event.pointerId !== undefined) event.currentTarget.setPointerCapture(event.pointerId);
        }

        function hP(key, event) {
            if (keyboardMode !== 'full' || !socket.connected) return;
            v();
            captureKeyPointer(event);
            hR();
            sendKey(key);
            rT = setTimeout(() => { rI = setInterval(() => sendKey(key), 80); }, 500);
        }

        function hR() { clearTimeout(rT); clearInterval(rI); }

        // --- 特殊功能键核心逻辑 ---
        function hFuncStart(key, event) {
            if (keyboardMode !== 'full' || !socket.connected) return;
            v();
            captureKeyPointer(event);
            newlyLockedKeys.delete(key);

            // 如果当前是锁定状态，点一下准备解锁
            if (locks[key]) {
                return;
            }

            // 正常按下
            pressKey(key);

            // 开启长按计时
            lockTimers.set(key, setTimeout(() => {
                lockTimers.delete(key);
                locks[key] = true;
                newlyLockedKeys.add(key);
                const btn = document.getElementById(key + '-key');
                if (btn) btn.classList.add('locked');
                if (key.includes('shift')) updateSymbols();
            }, 600));
        }

        function hFuncEnd(key) {
            clearTimeout(lockTimers.get(key));
            lockTimers.delete(key);

            // 场景 A: 如果已经是锁定状态，这次是“轻点一下”来恢复
            if (locks[key] && !newlyLockedKeys.has(key)) {
                locks[key] = false;
                const btn = document.getElementById(key + '-key');
                if (btn) btn.classList.remove('locked');
                releaseKey(key);
                if (key.includes('shift')) updateSymbols();
                return;
            }

            // 场景 B: 如果是短按（没触发长按锁定），松手即弹起
            if (!locks[key]) {
                releaseKey(key);
            }
            newlyLockedKeys.delete(key);
        }

        function toggleLock(key) {
            if (keyboardMode !== 'full' || !socket.connected) return;
            v();
            locks[key] = !locks[key];
            const btn = document.getElementById(key + '-key');
            if (btn) btn.classList.toggle('locked', locks[key]);
            // Caps Lock 本身是开关，只发送一次点击，避免服务端长按重复切换。
            sendKey(key === 'caps' ? 'caps_lock' : key);
        }

        function updateSymbols() {
            const isShift = locks.shift || locks.shift_r;
            document.querySelectorAll('.k-sym').forEach(btn => {
                btn.innerText = isShift ? btn.dataset.shft : btn.dataset.norm;
            });
        }

        function pressKey(key) {
            if (keyboardMode !== 'full' || !socket.connected) return false;
            socket.emit('key_action', { key: key, action: 'down' });
            pressedKeys.add(key);
            return true;
        }

        function releaseKey(key) {
            if (pressedKeys.delete(key)) {
                socket.emit('key_action', { key: key, action: 'up' });
            }
        }

        function sendKey(key) {
            if (!pressKey(key)) return;
            clearTimeout(releaseTimers.get(key));
            releaseTimers.set(key, setTimeout(() => {
                releaseTimers.delete(key);
                releaseKey(key);
            }, 30));
        }

        function releaseAllKeys() {
            hR();
            releaseTimers.forEach(timer => clearTimeout(timer));
            releaseTimers.clear();
            lockTimers.forEach(timer => clearTimeout(timer));
            lockTimers.clear();
            newlyLockedKeys.clear();
            for (const key of pressedKeys) releaseKey(key);
            for (let key in locks) {
                locks[key] = false;
                const btn = document.getElementById(key + '-key');
                if (btn) btn.classList.remove('locked');
            }
            updateSymbols();
        }

        function switchMode(mode) {
            if (mode === keyboardMode) return;
            releaseAllKeys();
            if (mode === 'full') document.getElementById('text-input').blur();
            keyboardMode = mode;
            document.body.classList.toggle('text-mode', mode === 'text');
            document.body.classList.toggle('full-mode', mode === 'full');
            document.getElementById('text-panel').hidden = mode !== 'text';
            document.getElementById('full-keyboard').hidden = mode !== 'full';
            document.getElementById('full-keyboard-footer').hidden = mode !== 'full';
            document.getElementById('text-mode-button').setAttribute('aria-pressed', String(mode === 'text'));
            document.getElementById('full-mode-button').setAttribute('aria-pressed', String(mode === 'full'));
            resetHeight();
        }

        function leaveKeyboard(url) {
            releaseAllKeys();

            // 稍微延时确保 socket 消息发出后再跳转
            setTimeout(() => {
                window.location.href = url;
            }, 50);
        }

        function goBack() { leaveKeyboard('/'); }

        document.getElementById('full-keyboard').addEventListener('pointercancel', releaseAllKeys);
        window.addEventListener('blur', releaseAllKeys);
        window.addEventListener('pagehide', releaseAllKeys);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) releaseAllKeys();
        });
        socket.on('disconnect', releaseAllKeys);

        function toggleTablet() {
            document.body.classList.toggle('tablet-mode');
            const isTablet = document.body.classList.contains('tablet-mode');
            document.getElementById('tablet-toggle').innerText = isTablet ? '普通模式' : '平板模式';
            localStorage.setItem('kb_tablet_mode', isTablet);
        }

        // 初始化平板模式
        if (localStorage.getItem('kb_tablet_mode') === 'true') {
            toggleTablet();
        }

        // 1. 动态高度补丁 (防止键盘弹出时遮挡或布局跳动)
        function resetHeight() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
            const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--viewport-height', `${viewportHeight}px`);
        }
        window.addEventListener('resize', resetHeight);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', resetHeight);
        resetHeight();

        // 2. 全屏切换函数
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // 3. 监听全屏状态改变图标和缩放类
        function updateFullscreenUI() {
            const iconPath = document.querySelector('#fs-icon-kb path');
            if (document.fullscreenElement) {
                document.body.classList.remove('not-fs');
                if (iconPath) iconPath.setAttribute('d', 'M14,14H19V16H16V19H14V14M5,14H10V19H8V16H5V14M8,5H10V10H5V8H8V5M19,8V10H14V5H16V8H19Z');
            } else {
                document.body.classList.add('not-fs');
                if (iconPath) iconPath.setAttribute('d', 'M5,5H10V7H7V10H5V5M14,5H19V10H17V7H14V5M17,14H19V19H14V17H17V14M10,17V19H5V14H7V17H10Z');
            }
        }
        document.addEventListener('fullscreenchange', updateFullscreenUI);
        updateFullscreenUI(); // 初始化
    </script>
</body>
